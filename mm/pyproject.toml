[project]
name = "mm"
version = "0.0.1"
description = "Regime-adaptive market-making research (simulation/paper only)"
requires-python = ">=3.12"
dependencies = ["websockets>=13"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
