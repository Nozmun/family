<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Reel</title>
<style>
  @font-face { font-family: 'Unbounded'; font-weight: 900; src: url(fonts/unbounded-900.woff2) format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(fonts/spacegrotesk-700.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(fonts/jetbrainsmono-500.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(fonts/instrumentserif-italic.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  body:not(.render) canvas { position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 16 / 9; cursor: pointer; }
  #hint { position: fixed; left: 16px; bottom: 12px; color: #888; font: 12px 'JetBrains Mono', monospace; }
  body.render #hint { display: none; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<div id="hint">click: play / pause · ← →: scrub</div>
<audio id="music" src="soundtrack.wav" preload="auto"></audio>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────
//  MOTION REEL — 15s, 1920×1080, 60fps, 120 BPM (1 beat = 0.5s)
//  Everything is procedural: renderFrame(n) is a pure function
//  of the frame number, so the offline renderer and the live
//  preview produce identical pictures.
// ─────────────────────────────────────────────────────────────
const W = 1920, H = 1080, FPS = 60, DUR = 15, FRAMES = FPS * DUR;
const TAU = Math.PI * 2;
const C = {
  ink: '#0A0A12', night: '#06060C', cream: '#F3EDE2', coral: '#FF4B2B',
  lime: '#D7FF3A', cobalt: '#2F4BFF', pink: '#FF3D9A', violet: '#7B3BFF',
};
const DISPLAY = "900 1px 'Unbounded'";

// ── math & easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const range = (t, a, b) => clamp((t - a) / (b - a));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  inOutBack: t => { const c = 1.70158 * 1.525; return t < .5 ? (Math.pow(2 * t, 2) * ((c + 1) * 2 * t - c)) / 2 : (Math.pow(2 * t - 2, 2) * ((c + 1) * (t * 2 - 2) + c) + 2) / 2; },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; }
// Decaying pulse after each time in `times`.
const pulse = (t, times, k = 10) => times.reduce((s, b) => s + (t >= b ? Math.exp(-(t - b) * k) : 0), 0);
const BEATS = Array.from({ length: 30 }, (_, i) => i * 0.5);

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h1, h2, t) { const a = hexToRgb(h1), b = hexToRgb(h2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`; }
function withAlpha(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function font(ctx, px, fam = DISPLAY) { ctx.font = fam.replace('1px', px.toFixed(1) + 'px'); }

// ── canvases ─────────────────────────────────────────────────
const out = document.getElementById('out');
const octx = out.getContext('2d');
const sceneC = mk(W, H), sctx = sceneC.getContext('2d');
const bufC = mk(W, H), bctx = bufC.getContext('2d');
const LW = 960, LH = 540, liquidC = mk(LW, LH), lctx = liquidC.getContext('2d');
const liquidImg = lctx.createImageData(LW, LH), liquidPx = new Uint32Array(liquidImg.data.buffer);

// ── precomputed assets ──────────────────────────────────────
// Film grain tiles
const grain = [0, 1, 2].map(k => {
  const c = mk(256, 256), g = c.getContext('2d'), im = g.createImageData(256, 256), r = rng(99 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});

// Polar shape tables (radius per angle) for the morph scene
const NS = 256;
function polyShape(verts) {
  const out = new Float32Array(NS);
  for (let i = 0; i < NS; i++) {
    const a = i / NS * TAU, dx = Math.cos(a), dy = Math.sin(a); let best = 1e9;
    for (let j = 0; j < verts.length; j++) {
      const [x1, y1] = verts[j], [x2, y2] = verts[(j + 1) % verts.length], ex = x2 - x1, ey = y2 - y1;
      const den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) continue;
      const s = (x1 * ey - ex * y1) / den, u = (dy * x1 - dx * y1) / den;
      if (s > 0 && u >= -1e-6 && u <= 1 + 1e-6 && s < best) best = s;
    }
    out[i] = best;
  }
  return out;
}
const ngon = (k, r = 1, a0 = -Math.PI / 2) => Array.from({ length: k }, (_, i) => [Math.cos(a0 + i * TAU / k) * r, Math.sin(a0 + i * TAU / k) * r]);
const SHAPE = {
  circle: new Float32Array(NS).fill(1),
  square: polyShape(ngon(4, 1.18, -Math.PI / 4)),
  tri: polyShape(ngon(3, 1.3)),
  star: polyShape(Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * TAU / 10, r = i % 2 ? .5 : 1.28; return [Math.cos(a) * r, Math.sin(a) * r]; })),
};

// Point-cloud targets for the depth scene
const NP = 2400;
const CLOUD = (() => {
  const r = rng(7), start = [], sphere = [], torus = [], cube = [], galaxy = [], col = [];
  for (let i = 0; i < NP; i++) {
    // scattered shell
    const u = r() * 2 - 1, th = r() * TAU, rr = 4 + r() * 5, sq = Math.sqrt(1 - u * u);
    start.push([sq * Math.cos(th) * rr, u * rr, sq * Math.sin(th) * rr]);
    // fibonacci sphere
    const y = 1 - (i + .5) / NP * 2, rad = Math.sqrt(1 - y * y), phi = i * Math.PI * (3 - Math.sqrt(5));
    sphere.push([Math.cos(phi) * rad * 1.05, y * 1.05, Math.sin(phi) * rad * 1.05]);
    // torus grid
    const tu = (i % 80) / 80 * TAU, tv = Math.floor(i / 80) / (NP / 80) * TAU;
    torus.push([(1 + .38 * Math.cos(tv)) * Math.cos(tu), .38 * Math.sin(tv), (1 + .38 * Math.cos(tv)) * Math.sin(tu)]);
    // cube surface lattice
    const s = .7;
    if (i % 5 < 2) {
      // edges carry the silhouette
      const e = Math.floor(r() * 12), ax = e >> 2, v = r() * 2 - 1, sa = e & 1 ? s : -s, sb = e & 2 ? s : -s;
      cube.push(ax === 0 ? [v * s, sa, sb] : ax === 1 ? [sa, v * s, sb] : [sa, sb, v * s]);
    } else {
      const face = i % 6, snap = v => Math.round(v * 6) / 6;
      const fa = snap(r() * 2 - 1) * s, fb = snap(r() * 2 - 1) * s, sign = face % 2 ? 1 : -1;
      cube.push(face < 2 ? [sign * s, fa, fb] : face < 4 ? [fa, sign * s, fb] : [fa, fb, sign * s]);
    }
    // three-arm galaxy
    const arm = i % 3, gt = Math.pow(r(), .7), ga = arm * TAU / 3 + gt * 4.2 + (r() - .5) * .28, gr = .12 + gt * 1.45;
    galaxy.push([Math.cos(ga) * gr, (r() - .5) * .12 * (1.2 - gt), Math.sin(ga) * gr]);
    col.push(Math.floor((i / NP * 5 + r() * .6)) % 5);
  }
  return { start, sphere, torus, cube, galaxy, col };
})();
const CLOUD_COLORS = [C.cobalt, C.violet, C.pink, C.coral, C.lime];

// Liquid color lookup: field value → packed ABGR
const LUT_N = 4096, LUT_MAX = 4;
const LUT = (() => {
  const lut = new Uint32Array(LUT_N);
  const pack = ([r, g, b]) => (255 << 24 | b << 16 | g << 8 | r) >>> 0;
  const bg = hexToRgb('#0B0B16'), line = hexToRgb('#27307A'), lime = hexToRgb(C.lime), cob = hexToRgb(C.cobalt), pink = hexToRgb(C.pink), coral = hexToRgb(C.coral);
  const m = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], clamp(t))));
  for (let i = 0; i < LUT_N; i++) {
    const f = i / LUT_N * LUT_MAX; let c;
    if (f < 1) {
      const fr = (f * 7) % 1, ln = f > .18 ? (1 - smooth(0, .09, Math.min(fr, 1 - fr) * 1.0)) * smooth(.18, .5, f) : 0;
      c = m(bg, line, ln);
      c = m(c, lime, smooth(.985, 1.0, f));
    } else {
      c = lime;
      c = m(c, cob, smooth(1.07, 1.09, f));
      c = m(c, pink, smooth(1.45, 1.48, f));
      c = m(c, coral, smooth(2.0, 2.04, f));
    }
    lut[i] = pack(c);
  }
  return lut;
})();

// Bauhaus grid tiles
const TILES = (() => {
  const r = rng(42), tiles = [];
  const fgs = [C.ink, C.cream, C.cobalt, C.lime, C.pink];
  for (let row = 0; row < 9; row++) for (let col = 0; col < 16; col++) {
    const type = Math.floor(r() * 5), fg = Math.floor(r() * fgs.length);
    let bg = r() < .32 ? Math.floor(r() * 3) : -1; if (bg >= 0 && [C.ink, C.cream, C.cobalt][bg] === fgs[fg]) bg = -1;
    tiles.push({ col, row, type, fg, bg, rot: Math.floor(r() * 4) });
  }
  return { tiles, fgs, bgs: [C.ink, C.cream, C.cobalt] };
})();

// Explosion particles (ignition → form)
const SPARKS = (() => { const r = rng(3); return Array.from({ length: 180 }, () => ({ a: r() * TAU, v: 300 + r() * 1400, s: 2 + r() * 7, c: [C.cream, C.lime, C.ink, C.cream][Math.floor(r() * 4)], spin: r() })); })();
const DUST = (() => { const r = rng(11); return Array.from({ length: 140 }, () => ({ x: r() * W, y: r() * H, z: .2 + r() * .8, p: r() * TAU })); })();

let stripePattern = null;
function buildPatterns() {
  const c = mk(240, 240), g = c.getContext('2d');
  const cols = [C.coral, C.pink, C.lime, C.cream];
  g.save(); g.translate(120, 120); g.rotate(-Math.PI / 4); g.translate(-240, -240);
  for (let i = 0; i < 16; i++) { g.fillStyle = cols[i % 4]; g.fillRect(i * 42.43, 0, 42.43, 480); }
  g.restore();
  stripePattern = octx.createPattern(c, 'repeat');
}

// Layout measured once fonts are ready
const L = {};
function fitSize(ctx, text, fam, targetW) { font(ctx, 100, fam); return 100 * targetW / ctx.measureText(text).width; }
function measureLayout() {
  const g = sctx;
  L.everySize = fitSize(g, 'EVERY', DISPLAY, 1180);
  L.frameSize = fitSize(g, 'FRAME', DISPLAY, 1180);
  L.isaSize = 190;
  font(g, L.isaSize, "italic 1px 'Instrument Serif'"); L.isaW = g.measureText('is a').width;
  L.choiceSize = fitSize(g, 'CHOICE', DISPLAY, W - 110 - (110 + L.isaW + 50) - 70);
  L.motionSize = fitSize(g, 'MOTION', DISPLAY, 1480);
  const letters = (txt, size) => { font(g, size); let x = 0; return [...txt].map(ch => { const w = g.measureText(ch).width; const o = { ch, x, w }; x += w; return o; }); };
  L.every = letters('EVERY', L.everySize);
  L.choice = letters('CHOICE', L.choiceSize);
  L.motion = letters('MOTION', L.motionSize);
  L.motionW = L.motion.reduce((s, l) => s + l.w, 0);
  L.choiceW = L.choice.reduce((s, l) => s + l.w, 0);
}

// ─────────────────────────────────────────────────────────────
//  SCENE 1 — IGNITION (0 → 2s)
// ─────────────────────────────────────────────────────────────
function sceneIgnition(g, t) {
  g.fillStyle = C.night; g.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  g.save(); g.translate(cx, cy);
  const push = 1 + E.inCubic(range(t, 1.2, 2.0)) * .25; g.scale(push, push);

  // shockwave rings on each heartbeat
  [0, .5, 1, 1.5].forEach((b, k) => {
    const age = t - b; if (age <= 0 || age > 1.3) return;
    const p = age / 1.3, R = 20 + E.outExpo(p) * (380 + k * 160);
    g.strokeStyle = withAlpha(k % 2 ? C.lime : C.cream, (1 - p) * .9);
    g.lineWidth = 7 * (1 - p) + .5; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.stroke();
    // tick marks riding the ring
    for (let i = 0; i < 24; i++) { const a = i / 24 * TAU + k; g.fillStyle = withAlpha(C.cream, (1 - p) * .6); g.fillRect(Math.cos(a) * (R + 18) - 2, Math.sin(a) * (R + 18) - 2, 4, 4); }
  });

  // the dot → line → fan
  const grow = E.outBack(range(t, .05, .4), 3);
  const beat = pulse(t, [0, .5, 1, 1.5], 9);
  const lineP = E.inOutExpo(range(t, 1.0, 1.45));
  const fanP = E.inOutCubic(range(t, 1.45, 1.98));
  const n = 28;
  g.rotate(fanP * .6 + t * .15);
  if (lineP > 0) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * fanP;
      const len = lineP * 1150 * (i % 2 ? .82 : 1) * (1 - fanP * .25 * (i % 3));
      g.save(); g.rotate(a);
      g.fillStyle = [C.cream, C.coral, C.lime, C.cobalt][i % 4];
      const th = (i === 0 ? 4 : 3) * (1 + beat * .8);
      g.fillRect(-len, -th / 2, len * 2, th);
      g.restore();
      if (fanP === 0) break;
    }
  }
  const r = 13 * grow + beat * 9;
  g.fillStyle = C.cream; g.beginPath(); g.arc(0, 0, Math.max(0, r), 0, TAU); g.fill();
  g.strokeStyle = withAlpha(C.cream, .5 * grow); g.lineWidth = 1.5; g.beginPath(); g.arc(0, 0, r + 14 + beat * 30, 0, TAU); g.stroke();
  g.restore();

  // countdown numerals flicking in the corner of the dot
  const count = ['4', '3', '2', '1'][Math.min(3, Math.floor(t / .5))];
  const cp = range(t % .5, 0, .12);
  g.fillStyle = withAlpha(C.cream, .85 * (1 - range(t, 1.85, 2)));
  font(g, 26, "500 1px 'JetBrains Mono'"); g.textAlign = 'left';
  g.fillText(count, cx + 40, cy - 36 + (1 - E.outCubic(cp)) * 14);
}

// ─────────────────────────────────────────────────────────────
//  SCENE 2 — FORM (2 → 4s)
// ─────────────────────────────────────────────────────────────
function morphRadii(t) {
  const r = new Float32Array(SHAPE.circle);
  const keys = [[2.5, SHAPE.square], [3.0, SHAPE.tri], [3.5, SHAPE.star], [3.74, SHAPE.circle]];
  for (const [kt, s] of keys) {
    const p = kt === 3.74 ? E.outCubic(range(t, kt, kt + .16)) : E.outElastic(range(t, kt, kt + .6));
    if (p === 0) continue;
    for (let i = 0; i < NS; i++) r[i] = lerp(r[i], s[i], p);
  }
  return r;
}
function shapePath(g, radii, R, rot) {
  g.beginPath();
  for (let i = 0; i <= NS; i++) {
    const a = i / NS * TAU, rr = radii[i % NS] * R;
    const x = Math.cos(a + rot) * rr, y = Math.sin(a + rot) * rr;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
const formRot = t => t * .5 + [2.5, 3.0, 3.5].reduce((s, b) => s + E.outBack(range(t, b, b + .45), 2.2) * Math.PI / 3, 0);
const formR = t => 250 * E.outElastic(range(t, 2.0, 2.9)) * (1 + pulse(t, BEATS.filter(b => b >= 2 && b < 4), 12) * .08);

function sceneForm(g, t) {
  const cx = W / 2, cy = H / 2;
  // coral background revealed by an iris from the ignition point
  const iris = E.outExpo(range(t, 2.0, 2.45)) * 1250;
  if (iris < 1150) sceneIgnition(g, Math.min(t, 2.0) + (t - 2.0) * .3);
  g.save(); g.beginPath(); g.arc(cx, cy, iris, 0, TAU); g.clip();
  g.fillStyle = C.coral; g.fillRect(0, 0, W, H);

  // cobalt skewed-slat wipe on bar 3
  const slats = 10;
  for (let i = 0; i < slats; i++) {
    const p = E.outExpo(range(t, 3.0 + i * .025, 3.0 + i * .025 + .4)); if (p <= 0) continue;
    const x0 = i * (W + 280) / slats - 280, w = (W + 280) / slats + 2, h = p * (H + 60);
    g.fillStyle = C.cobalt; g.beginPath();
    g.moveTo(x0, H); g.lineTo(x0 + w, H); g.lineTo(x0 + w + 280, H - h); g.lineTo(x0 + 280, H - h); g.closePath(); g.fill();
  }

  // outline marquee type
  font(g, 250);
  g.lineWidth = 2.5; g.textBaseline = 'middle';
  const onCob = range(t, 3.05, 3.2);
  g.strokeStyle = withAlpha(C.cream, .38);
  const row = 'FORM · MOTION · FORM · MOTION · FORM · ';
  const rw = g.measureText(row).width;
  g.textAlign = 'left';
  const off1 = -((t - 2) * 260) % rw, off2 = -rw + ((t - 2) * 200) % rw;
  g.strokeText(row + row, off1 - 60, cy - 330);
  g.strokeText(row + row, off2, cy + 330);

  // explosion sparks
  SPARKS.forEach(s => {
    const age = t - 2.0; if (age < 0 || age > 1.1) return;
    const d = s.v * (1 - Math.exp(-age * 4)) / 4 * 1.6, fade = 1 - age / 1.1;
    g.save(); g.translate(cx + Math.cos(s.a) * d, cy + Math.sin(s.a) * d); g.rotate(s.spin * 10 + age * 6);
    g.fillStyle = s.c; g.globalAlpha = fade; g.fillRect(-s.s / 2, -s.s * 1.5, s.s, s.s * 3); g.restore();
  });
  g.globalAlpha = 1;

  // orbiters behind
  const orb = (front) => {
    for (let k = 0; k < 3; k++) {
      const a = t * 2.4 + k * TAU / 3, z = Math.sin(a);
      if ((z > 0) !== front) continue;
      const sc = .75 + z * .35, x = Math.cos(a) * 470, y = Math.sin(a) * 120;
      g.save(); g.translate(cx, cy); g.rotate(-.25); g.translate(x, y);
      g.fillStyle = [C.cream, C.lime, C.ink][k];
      g.beginPath(); g.arc(0, 0, 26 * sc * E.outBack(range(t, 2.2 + k * .08, 2.6 + k * .08)), 0, TAU); g.fill(); g.restore();
    }
  };
  orb(false);

  // morphing hero shape with offset echoes
  g.save(); g.translate(cx, cy);
  const echoCols = [C.cream, C.lime, C.pink, C.cream, C.lime];
  for (let k = 5; k >= 1; k--) {
    const te = t - k * .045, R = formR(te); if (R <= 0) continue;
    shapePath(g, morphRadii(te), R, formRot(te));
    g.lineWidth = 3; g.strokeStyle = withAlpha(onCob > .5 ? echoCols[k - 1] : C.cream, .85 - k * .12); g.stroke();
  }
  const R = formR(t);
  if (R > 0) {
    shapePath(g, morphRadii(t), R, formRot(t));
    g.fillStyle = onCob > .5 ? C.lime : C.ink; g.fill();
    // inner detail: rotating dashed ring
    g.setLineDash([4, 14]); g.lineWidth = 3; g.strokeStyle = withAlpha(onCob > .5 ? C.ink : C.coral, .9);
    g.beginPath(); g.arc(0, 0, R * .42, t * 2, t * 2 + TAU); g.stroke(); g.setLineDash([]);
    g.fillStyle = onCob > .5 ? C.ink : C.coral; g.beginPath(); g.arc(0, 0, R * .12, 0, TAU); g.fill();
  }
  g.restore();
  orb(true);
  g.restore(); // iris clip

  // hard cut: shape swells into the next scene's cream canvas
  const swell = E.inExpo(range(t, 3.76, 4.0));
  if (swell > 0) { g.fillStyle = C.cream; g.beginPath(); g.arc(cx, cy, 200 + swell * 1000, 0, TAU); g.fill(); }
}

// ─────────────────────────────────────────────────────────────
//  SCENE 3 — TYPE (4 → 6s)
// ─────────────────────────────────────────────────────────────
function sceneType(g, t) {
  g.fillStyle = C.cream; g.fillRect(0, 0, W, H);
  const M = 110;
  g.save();
  const cam = E.outCubic(range(t, 4, 6)) * .035;

// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────
//  SCENE 5 — FLUID (8 → 10s)
// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────
//  SCENE 6 — SYSTEM (10 → 12s)
// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────
//  SCENE 7 — MOTION (12 → 15s)
// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────
//  COMPOSITION
// ─────────────────────────────────────────────────────────────

    }
  }
  g.putImageData(im, 0, 0);
}

const CHAPTERS = [[0, 'IGNITION'], [2, 'FORM'], [4, 'TYPE'], [6, 'DEPTH'], [8, 'FLUID'], [10, 'SYSTEM'], [12, 'MOTION']];
function hudColor(t) {
  if (t < 2.05) return C.cream;
  if (t < 3.1) return C.ink;
  if (t < 3.99) return C.cream;
  if (t < 5.95) return C.ink;
  if (t < 10.0) return C.cream;
  if (t < 11.75) return C.ink;
  return C.cream;
}
function hud(g, t, frame) {
  const a = E.outCubic(range(t, 0.05, 0.4)) * (1 - range(t, 14.45, 14.7));
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; const col = hudColor(t);
  g.fillStyle = col; g.strokeStyle = col;
  const m = 54;
  // crop marks
  g.lineWidth = 2;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    g.beginPath(); g.moveTo(x, y + sy * 26); g.lineTo(x, y); g.lineTo(x + sx * 26, y); g.stroke();
  });
  font(g, 18, "500 1px 'JetBrains Mono'"); g.textBaseline = 'middle';
  // chapter indicator with a rolling number
  let ci = 0; CHAPTERS.forEach(([ct], i) => { if (t >= ct) ci = i; });
  const roll = E.outExpo(range(t - CHAPTERS[ci][0], 0, .35));
  g.save(); g.beginPath(); g.rect(m + 40, m + 2, 400, 30); g.clip(); g.textAlign = 'left';
  const chap = i => `${String(i + 1).padStart(2, '0')} / ${CHAPTERS[i][1]}`;
  g.fillText(chap(ci), m + 42, m + 17 + (1 - roll) * 28);
  if (ci > 0 && roll < 1) g.fillText(chap(ci - 1), m + 42, m + 17 - roll * 28);
  g.restore();
  g.textAlign = 'right';
  g.fillText('MOTION REEL — MMXXVI', W - m - 42, m + 17);
  // bottom row
  g.textAlign = 'left';
  g.fillText('1920×1080 · 60 FPS · CANVAS 2D', m + 42, H - m - 17);
  const f = frame % 60, s = Math.floor(frame / 60);
  g.textAlign = 'right';
  g.fillText(`00:00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`, W - m - 42, H - m - 17);
  // progress rail
  const rx = m + 400, rw = W - 2 * m - 800, ry = H - m - 17;
  g.globalAlpha = a * .3; g.fillRect(rx, ry - 1, rw, 2);
  g.globalAlpha = a; g.fillRect(rx, ry - 1.5, rw * (t / DUR), 3);
  CHAPTERS.forEach(([ct]) => { g.fillRect(rx + rw * ct / DUR - 1, ry - 7, 2, 14); });
  g.restore();
}

function post(g, t, frame) {
  chromatic(g, t);
  // vignette
  const v = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.42)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  // grain
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .09;
  const gt = grain[frame % 3], ox = -Math.floor(hash(frame) * 256), oy = -Math.floor(hash(frame + .5) * 256);
  for (let y = oy; y < H; y += 256) for (let x = ox; x < W; x += 256) g.drawImage(gt, x, y);
  g.restore();
}

// Render one output frame with `sub` motion-blur subframes over a 180° shutter.
function renderFrame(frame, sub = 4) {
  const t0 = frame / FPS;
  for (let i = 0; i < sub; i++) {
    const t = t0 + (i / sub) * (.5 / FPS);
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    drawScene(sctx, t);
    octx.globalAlpha = 1 / (i + 1);
    octx.drawImage(sceneC, 0, 0);
  }
  octx.globalAlpha = 1;
  post(octx, t0, frame);
  hud(octx, t0, frame);
}

// ── boot ────────────────────────────────────────────────────
const RENDER = new URLSearchParams(location.search).has('render');
window.renderFrame = renderFrame;
window.FRAMES = FRAMES;
window.ready = (async () => {
  await Promise.all(['900 40px Unbounded', "500 20px 'JetBrains Mono'", "italic 40px 'Instrument Serif'"].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  buildPatterns(); measureLayout();
  return true;
})();

if (RENDER) document.body.classList.add('render');
else window.ready.then(() => {
  const music = document.getElementById('music');
  let playing = false, startAt = 0, pausedAt = 0;
  const now = () => playing ? (performance.now() - startAt) / 1000 : pausedAt;
  const toggle = () => {
    if (playing) { pausedAt = now(); playing = false; music.pause(); }
    else { startAt = performance.now() - pausedAt * 1000; playing = true; music.currentTime = pausedAt; music.play().catch(() => {}); }
  };
  out.addEventListener('click', toggle);
  addEventListener('keydown', e => {
    if (e.key === ' ') toggle();
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const d = e.key === 'ArrowRight' ? .5 : -.5; pausedAt = clamp(now() + d, 0, DUR - .001); startAt = performance.now() - pausedAt * 1000; music.currentTime = pausedAt; }
  });
  const loop = () => {
    let t = now();
    if (t >= DUR) { t = 0; startAt = performance.now(); music.currentTime = 0; }
    renderFrame(Math.floor(t * FPS), 1);
    requestAnimationFrame(loop);
  };
  renderFrame(0, 1); loop();
});
</script>
